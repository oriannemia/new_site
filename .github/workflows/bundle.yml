# À chaque push : rassembler les pages en un seul fichier HTML et un fichier Word.
name: bundle
on: push

jobs:
  bundle:
    runs-on: ubuntu-latest # une machine Linux prêtée par GitHub, effacée après
    steps:
      - uses: actions/checkout@v7 # récupérer les fichiers du dépôt
      - run: sudo apt-get update && sudo apt-get install -y pandoc # sudo : sur la machine de GitHub, pas la vôtre
      - run: pandoc index.md a-propos.md notes.md -s --metadata title="Mon petit site" -o site.html
      - run: pandoc index.md a-propos.md notes.md -o site.docx
      - uses: actions/upload-artifact@v7 # garder les deux fichiers, téléchargeables depuis la page du run
        with:
          name: site
          path: |
            site.html
            site.docx
